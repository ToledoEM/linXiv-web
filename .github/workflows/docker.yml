name: Docker image

# Releases come from the `release` branch: a push (merged PR from main) builds
# ghcr.io/toledoem/linxiv-web:<version> + :latest, tags v<version> and creates a
# GitHub Release. A version already tagged fails the run: bump it first.
on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      linxiv_ref:
        description: "linXiv tag/branch to bundle (Dockerfile LINXIV_REF)"
        required: false
        default: v0.7.0
        type: string

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

# Jobs grant their own permissions; nothing by default.
permissions: {}

env:
  IMAGE: ghcr.io/toledoem/linxiv-web
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

jobs:
  version:
    name: Version check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The three version strings must agree; a push to release needs an untagged
      # version. Manual runs rebuild the current version without tagging.
      - name: Read version, check it is new
        id: meta
        env:
          EVENT: ${{ github.event_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' server/pyproject.toml | head -n1)
          if [ -z "$version" ]; then
            echo "::error::no version in server/pyproject.toml"
            exit 1
          fi
          app=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' server/app/main.py | head -n1)
          web=$(jq -r .version web/package.json)
          if [ "$app" != "$version" ] || [ "$web" != "$version" ]; then
            echo "::error::versions differ: pyproject $version, main.py $app, package.json $web"
            exit 1
          fi
          publish=true
          if [ "$EVENT" = push ] && git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released; bump the version on main, then merge to release"
            exit 1
          fi
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "release=$([ "$EVENT" = push ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          # Native arm runner: the Rust CLI build is far too slow under QEMU,
          # and fetch_pdfium.sh picks the pdfium binary from `uname -m`.
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: LINXIV_REF=${{ inputs.linxiv_ref || 'v0.7.0' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish manifest
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        working-directory: digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  release:
    name: Tag and GitHub Release
    needs: [version, merge]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Notes = the CHANGELOG section of this version, else GitHub's generated notes.
      - name: Create v<version> tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if grep -q '[^[:space:]]' notes.md; then
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "v$VERSION" --target "$SHA" --title "v$VERSION" "${notes[@]}"
