[project]
name = "linxiv-web-server"
version = "0.1.0"
description = "Web UI backend for linXiv, driving the linxiv CLI"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs the real linxiv binary (LINXIV_BIN)"]

[tool.ruff]
line-length = 100
target-version = "py311"
