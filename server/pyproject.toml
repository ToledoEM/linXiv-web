[project]
name = "linxiv-web-server"
version = "0.1.1"
description = "Web UI backend for linXiv, driving the linxiv CLI"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "pypdf>=6",
    "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov --cov-report=term"
markers = ["integration: needs the real linxiv binary (LINXIV_BIN)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "S", "B", "UP", "I", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests: plain asserts, fake passwords, 0.0.0.0 bind cases, subprocess fixtures.
"tests/**" = ["S101", "S104", "S105", "S106", "S107", "S603"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
skip_covered = true
fail_under = 90
