name: Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      linxiv_ref:
        description: "linXiv tag/branch to bundle (Dockerfile LINXIV_REF)"
        required: false
        default: v0.7.0
        type: string

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

# Jobs grant their own permissions; nothing by default.
permissions: {}

env:
  IMAGE: ghcr.io/toledoem/linxiv-web
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

jobs:
  version:
    name: Version check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Push to main publishes only a version not yet in GHCR; manual runs always rebuild.
      - name: Read server version, compare with GHCR
        id: meta
        env:
          EVENT: ${{ github.event_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' server/pyproject.toml | head -n1)
          if [ -z "$version" ]; then
            echo "::error::no version in server/pyproject.toml"
            exit 1
          fi
          publish=true
          if [ "$EVENT" = push ] && docker buildx imagetools inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "::notice::$IMAGE:$version already published; bump server/pyproject.toml to release"
            publish=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          # Native arm runner: the Rust CLI build is far too slow under QEMU,
          # and fetch_pdfium.sh picks the pdfium binary from `uname -m`.
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: LINXIV_REF=${{ inputs.linxiv_ref || 'v0.7.0' }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish manifest
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        working-directory: digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker buildx imagetools create -t "$IMAGE:$VERSION" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$VERSION"
