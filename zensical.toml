[project]
site_name = "linXiv-web"
site_description = "Browser UI for the linXiv paper library"
docs_dir = "docs"
site_dir = "site"
copyright = 'Docs made with <a href="https://zensical.org">Zensical</a> · linXiv developed by <a href="https://github.com/linxiv-dev">linxiv-dev</a> · linXiv-web developed by ToledoEM · Apache License 2.0'
repo_url = "https://github.com/ToledoEM/linXiv-web"
repo_name = "ToledoEM/linXiv-web"

extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Install" = [
    { "Self-hosting with Docker" = "self-hosting.md" },
    { "Compatibility and resources" = "reference/compatibility.md" },
  ] },
  { "Using linXiv-web" = [
    { "Home feed" = "guide/home-feed.md" },
    { "Library" = "guide/library.md" },
    { "Paper page" = "guide/papers.md" },
    { "Projects and reading lists" = "guide/projects.md" },
    { "Search and add papers" = "guide/search-and-add.md" },
    { "Authors, graph and tags" = "guide/authors-graph-tags.md" },
    { "Settings" = "guide/settings.md" },
    { "Trash and backups" = "guide/trash-backup.md" },
  ] },
  { "AI and agents" = [
    { "AI features" = "ai.md" },
    { "MCP server" = "mcp.md" },
  ] },
  { "Server scripts" = [
    { "Bulk PDF import" = "bulk-import.md" },
    { "Bulk AI tags" = "bulk-ai-tags.md" },
  ] },
  { "Reference" = [
    { "Admin Server Configuration" = "reference/configuration.md" },
    { "HTTP API" = "reference/api.md" },
    { "Functions not in the CLI" = "functions-not-in-api.md" },
  ] },
  { "Development" = "development.md" },
]

[project.extra]
generator = false

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/favicon.ico"
icon.repo = "fontawesome/brands/github"
features = [
  "content.code.copy",
  "content.code.select",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
